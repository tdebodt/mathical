<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mathlib graph navigator</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f5f1; --surface: #ffffff; --line: #dcd9d0; --text: #1d1c1a; --muted: #6d6a63;
    --accent: #b4491f; --edge: #a9a59a; --pill: #ffffff; --pill-line: #cfcbc0; --focus-bg: #fff3ea;
    --k-theorem: #3f6fd1; --k-definition: #2a9461; --k-abbrev: #1397a1; --k-inductive: #7c55e0;
    --k-constructor: #cc4c92; --k-opaque: #7a7a7a; --k-axiom: #cf3f3f; --k-quotient: #cf8317; --k-unknown: #a0a0a0;
    --c-kw: #a3368f; --c-tac: #2f63c9; --c-comment: #7d7a72; --c-str: #2b7d4f; --c-num: #a85d00; --c-attr: #7c55e0; --c-warn: #cf3f3f;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17171a; --surface: #1f1f23; --line: #34343a; --text: #ecebe6; --muted: #9a988f;
      --accent: #f08a54; --edge: #5b5b63; --pill: #26262b; --pill-line: #3d3d45; --focus-bg: #3a2a20;
      --k-theorem: #7ba0f0; --k-definition: #55c08d; --k-abbrev: #46c3cc; --k-inductive: #a68bf2;
      --k-constructor: #e57fb7; --k-opaque: #a3a3a3; --k-axiom: #ee7070; --k-quotient: #e6a646; --k-unknown: #777;
      --c-kw: #e08ad0; --c-tac: #86aaf5; --c-comment: #8d8b83; --c-str: #6fcf9a; --c-num: #e5ad5a; --c-attr: #b39cf5; --c-warn: #f08080;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: grid; grid-template-rows: auto 1fr; background: var(--bg); color: var(--text);
         font: 14px/1.45 var(--sans); overflow: hidden; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 10px 16px;
           background: var(--surface); border-bottom: 1px solid var(--line); }
  h1 { font-size: 15px; margin: 0; font-weight: 650; letter-spacing: .01em; white-space: nowrap; }
  h1 a { color: inherit; text-decoration: none; border-radius: 4px; }
  h1 a:hover { color: var(--accent); }
  h1 a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .search { position: relative; flex: 1 1 320px; max-width: 560px; }
  .search input { width: 100%; padding: 7px 10px; font: 13px var(--mono); color: var(--text);
                  background: var(--bg); border: 1px solid var(--line); border-radius: 7px; }
  .search input:focus, button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  #results { position: absolute; z-index: 10; top: calc(100% + 4px); left: 0; right: 0; margin: 0; padding: 4px;
             list-style: none; background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
             box-shadow: 0 8px 28px rgb(0 0 0 / .18); max-height: 60vh; overflow: auto; }
  #results[hidden] { display: none; }
  #results li { display: flex; align-items: baseline; gap: 8px; padding: 5px 8px; border-radius: 5px; cursor: pointer; }
  #results li.active { background: var(--focus-bg); }
  #results .nm { font: 12.5px var(--mono); overflow-wrap: anywhere; }
  #results .meta { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; }
  #results .none { color: var(--muted); cursor: default; }
  .dot { flex: none; width: 9px; height: 9px; border-radius: 50%; display: inline-block; background: var(--k-unknown); }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; color: var(--muted); font-size: 13px; }
  .controls label, .controls .group { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
  .seg button { border: 0; border-right: 1px solid var(--line); border-radius: 0; }
  .seg button:last-child { border-right: 0; }
  button, select { font: inherit; font-size: 13px; color: var(--text); background: var(--surface);
                   border: 1px solid var(--line); border-radius: 7px; padding: 4px 10px; cursor: pointer; }
  button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  main { display: grid; grid-template-columns: 1fr clamp(320px, 30vw, 460px); grid-template-rows: auto minmax(0, 1fr) auto; min-height: 0; }
  #theorem { grid-column: 1; grid-row: 1; min-width: 0; max-height: 34vh; overflow-y: auto; display: flex; align-items: flex-start; gap: 16px;
             padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
  #theorem[hidden] { display: none; }
  #stage { grid-column: 1; grid-row: 2; }
  aside { grid-column: 2; grid-row: 1 / span 3; }
  #proof { grid-column: 1; grid-row: 3; min-width: 0; display: flex; flex-direction: column; max-height: 38vh;
           background: var(--surface); border-top: 1px solid var(--line); }
  #proof[hidden] { display: none; }
  #proof header { padding: 8px 16px; gap: 10px; border-bottom: 1px solid var(--line); flex-wrap: nowrap; }
  #proof h2 { font: 600 12px var(--sans); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 0; white-space: nowrap; }
  #proof .name { font: 12.5px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  #proof .spacer { flex: 1; }
  #proof pre { margin: 0; padding: 12px 16px; font: 12.5px/1.55 var(--mono); white-space: pre; overflow: auto; tab-size: 2; min-height: 0; }
  #proof.collapsed pre { display: none; }
  #stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
  svg { width: 100%; height: 100%; display: block; }
  #stage { cursor: grab; touch-action: none; user-select: none; }
  #stage.dragging { cursor: grabbing; }
  #boxes { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-origin: 0 0; pointer-events: none; }
  .zoom { position: absolute; right: 12px; bottom: 12px; display: flex; gap: 4px; }
  .legend { position: absolute; left: 12px; bottom: 12px; display: flex; flex-wrap: wrap; gap: 4px 12px; max-width: 70%;
            padding: 6px 10px; font-size: 12px; color: var(--muted); background: var(--surface);
            border: 1px solid var(--line); border-radius: 8px; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  #message { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; padding: 24px;
             color: var(--muted); pointer-events: none; }
  #message[hidden] { display: none; }
  #message > div { pointer-events: auto; max-width: 520px; }
  #message h2 { color: var(--text); font-size: 18px; margin: 0 0 6px; }
  #message a { font-family: var(--mono); font-size: 13px; }
  a { color: var(--accent); }
  /* A node: its name sits on the top edge, like the caption of a framed box; the formula is inside. */
  .node { --fill: var(--pill); position: absolute; box-sizing: border-box; width: max-content; min-width: 150px; max-width: 600px;
          padding: 14px 13px 10px; background: var(--fill); border: 1px solid var(--pill-line); border-radius: 9px;
          color: var(--text); cursor: pointer; pointer-events: auto; }
  .ntitle { display: flex; align-items: center; gap: 6px; width: max-content; max-width: calc(100% + 10px); margin: -23px 0 5px -5px; padding: 0 6px;
            font: 11px/18px var(--mono); color: var(--muted); white-space: nowrap; border-radius: 4px;
            background: linear-gradient(var(--bg) 0 50%, var(--fill) 50% 100%); }
  .ntitle .dot { width: 8px; height: 8px; }
  .ntitle .count { margin-left: 4px; font-size: 10.5px; opacity: .85; }
  .ntitle .count.zero { opacity: .5; }
  .nbody { font-size: 14.5px; line-height: 1.6; overflow-x: auto; overflow-y: hidden; }
  .nbody.words { max-width: 340px; font: 12.5px/1.45 var(--sans); color: var(--muted); white-space: normal; overflow-wrap: anywhere; }
  .nbody.words code { font: 11.5px var(--mono); }
  .node .usage { position: absolute; left: 10px; bottom: 3px; height: 2.5px; min-width: 2px; border-radius: 2px; background: var(--accent); opacity: .6; }
  /* Without a formula (or in the names view) the name goes inside, as a plain pill. */
  .node.compact { padding: 5px 11px 9px; }
  .node.compact .ntitle { margin: 0; padding: 0; max-width: none; background: none; font-size: 12px; color: var(--text); }
  .node:hover, .node.hl, .node:focus-visible { border-color: var(--accent); box-shadow: 0 0 0 .6px var(--accent); }
  .node:focus { outline: none; }
  .node.focus { --fill: var(--focus-bg); border: 2px solid var(--accent); cursor: default; }
  .node.focus .ntitle { color: var(--accent); font-weight: 650; }
  .node.compact.focus .ntitle { color: var(--text); }
  .node.stub { border-style: dashed; }
  .edge { fill: none; stroke: var(--edge); stroke-width: 1; opacity: .55; marker-end: url(#arrow); }
  .edge.syn { stroke-dasharray: 3 4; opacity: .35; }
  #stage.hovering .edge { opacity: .1; }
  #stage.hovering .edge.hl { stroke: var(--accent); opacity: 1; stroke-width: 1.5; marker-end: url(#arrow-hl); }
  /* spotlight: one node picked out from the proof text */
  #stage.spot .node:not(.pick):not(.focus) { opacity: .28; }
  #stage.spot .edge { opacity: .07; }
  #stage.spot .edge.pick { stroke: var(--accent); opacity: 1; stroke-width: 2.4; stroke-dasharray: none; marker-end: url(#arrow-hl); }
  .node.pick { --fill: var(--accent); border-color: var(--accent); color: #fff; }
  .node.pick .ntitle, .node.pick .nbody.words { color: #fff; }
  .node.pick .ntitle { background: var(--accent); }
  .node.pick .usage { background: #fff; opacity: .9; }
  .node.pick .dot { outline: 1.5px solid #fff; }
  /* the full statement of the node under the pointer */
  #tip { position: absolute; z-index: 5; max-width: min(560px, 80%); padding: 10px 14px; pointer-events: none;
         background: var(--surface); border: 1px solid var(--line); border-radius: 9px; box-shadow: 0 8px 28px rgb(0 0 0 / .18); }
  #tip[hidden] { display: none; }
  #proof .hint { color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  #arrow path { fill: var(--edge); } #arrow-hl path { fill: var(--accent); }
  .colhead { font: 600 12px var(--sans); fill: var(--text); text-anchor: middle; }
  .colsub { font: 11.5px var(--sans); fill: var(--muted); text-anchor: middle; }
  .empty { font: 12.5px var(--sans); fill: var(--muted); text-anchor: middle; }
  aside { border-left: 1px solid var(--line); background: var(--surface); padding: 16px; overflow: auto; min-width: 0; }
  aside h2 { font: 650 14px var(--mono); margin: 0 0 4px; overflow-wrap: anywhere; }
  aside .kind { display: flex; align-items: center; gap: 6px; color: var(--muted); margin-bottom: 12px; }
  aside dl { display: grid; grid-template-columns: auto 1fr; gap: 5px 12px; margin: 12px 0; font-size: 13px; }
  aside dt { color: var(--muted); white-space: nowrap; }
  aside dd { margin: 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
  aside dd.mono { font: 12px var(--mono); }
  aside .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  aside h3 { font: 600 12px var(--sans); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 16px 0 6px; }
  aside pre { margin: 0; padding: 10px 12px; font: 12px/1.5 var(--mono); background: var(--bg); border: 1px solid var(--line);
              border-radius: 8px; white-space: pre; overflow-x: auto; tab-size: 2; }
  #theorem .main { flex: 1; min-width: 0; }
  #theorem .doc { margin: 0 0 6px; font-size: 13.5px; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
  #theorem .doc strong { color: var(--text); }
  #theorem .doc code { font: 12.5px var(--mono); }
  code .kw { color: var(--c-kw); font-weight: 600; } code .tac { color: var(--c-tac); }
  code .comment { color: var(--c-comment); font-style: italic; } code .str { color: var(--c-str); }
  code .num { color: var(--c-num); } code .attr { color: var(--c-attr); } code .warn { color: var(--c-warn); font-weight: 600; }
  code a.dep { color: inherit; text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 1.5px;
               text-underline-offset: 3px; border-radius: 3px; cursor: pointer; }
  code a.dep:hover, code a.dep:focus-visible { background: var(--focus-bg); color: var(--accent); outline: none; }
  .tex { font-size: 15px; line-height: 1.7; }
  .tex .display { display: block; overflow-x: auto; overflow-y: hidden; padding: 8px 0 2px; }
  .tex .katex-display { margin: 0; }
  .tex .kind { font-weight: 650; }
  #theorem button { flex: none; font-size: 12px; padding: 3px 9px; white-space: nowrap; }
  aside p.note { color: var(--muted); font-size: 12.5px; }
  aside .linklike { border: 0; padding: 0; background: none; color: var(--accent); font: 12px var(--mono);
                    text-decoration: underline; text-align: left; overflow-wrap: anywhere; }
  @media (max-width: 860px) {
    body { overflow: auto; }
    main { grid-template-columns: 1fr; grid-template-rows: auto 62vh auto auto; }
    aside { grid-column: 1; grid-row: 4; border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<header>
  <h1><a href="/" id="home" title="Back to the starting theorem">Mathlib graph navigator</a></h1>
  <div class="search">
    <input id="q" type="search" placeholder="Search a theorem, lemma or definition…  ( / )" autocomplete="off"
           spellcheck="false" aria-label="Search declarations" aria-controls="results">
    <ul id="results" role="listbox" hidden></ul>
  </div>
  <div class="controls">
    <label title="Hide the dependencies Lean filled in by itself (typeclass instances and similar)">
      <input id="explicit" type="checkbox" checked> explicit only</label>
    <label title="Hide the logic and notation machinery of Lean's core library (Eq.mpr, propext, HAdd.hAdd, OfNat.ofNat …), which nearly every proof touches">
      <input id="plumbing" type="checkbox" checked> hide Lean plumbing</label>
    <label title="Show only theorems and lemmas around the focus; hide definitions, structures, instances and the rest">
      <input id="theorems" type="checkbox"> theorems only</label>
    <span class="group">depth
      <span class="seg" id="depth" role="group" aria-label="Depth">
        <button type="button" data-v="1">1</button><button type="button" data-v="2">2</button><button type="button" data-v="3">3</button>
      </span>
    </span>
    <label>show up to
      <select id="limit"><option>10</option><option>25</option><option>50</option><option>100</option></select> per level</label>
    <label title="Formulas: each node shows the conclusion of its statement. Names: compact boxes with the Lean name only">nodes as
      <select id="nodestyle"><option value="formulas">formulas</option><option value="names">names</option></select></label>
    <label title="What the number and bar on each node measure">nodes show
      <select id="metric">
        <option value="reach">all uses</option>
        <option value="direct">direct uses</option>
        <option value="pagerank">PageRank</option>
      </select></label>
    <label title="Conventions for the typeset statement: French / Belgian writes the angle ABC under a hat, open intervals as ]a, b[, and slanted ≤ ≥">notation
      <select id="notation"><option value="intl">International</option><option value="fr">French / Belgian</option></select></label>
  </div>
</header>
<main>
  <section id="theorem" aria-label="Statement" hidden></section>
  <div id="stage">
    <svg id="svg" role="img" aria-label="Dependency graph">
      <defs>
        <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z"/></marker>
        <marker id="arrow-hl" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z"/></marker>
      </defs>
      <g id="view"><g id="edges"></g><g id="labels"></g></g>
    </svg>
    <div id="boxes"></div>
    <div id="tip" hidden></div>
    <div id="message" hidden><div></div></div>
    <div class="legend" id="legend"></div>
    <div class="zoom">
      <button type="button" id="zout" aria-label="Zoom out">−</button>
      <button type="button" id="zin" aria-label="Zoom in">+</button>
      <button type="button" id="zfit">Fit</button>
    </div>
  </div>
  <section id="proof" aria-label="Proof" hidden>
    <header>
      <h2 id="proof-title">Proof</h2>
      <span class="name" id="proof-name"></span>
      <span class="hint" id="proof-hint" aria-live="polite"></span>
      <span class="spacer"></span>
      <button type="button" id="proof-toggle" aria-expanded="true">Hide</button>
    </header>
    <pre tabindex="0"><code id="proof-code"></code></pre>
  </section>
  <aside id="panel" aria-live="polite"></aside>
</main>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
<script src="/lean.js"></script>
<script src="/lean-phrases.js"></script>
<script src="/lean-latex.js"></script>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
const SVG = 'http://www.w3.org/2000/svg';
const el = (tag, attrs = {}, text) => {
  const e = document.createElementNS(SVG, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text !== undefined) e.textContent = text;
  return e;
};
const h = (tag, props = {}, ...kids) => {
  const e = Object.assign(document.createElement(tag), props);
  e.append(...kids);
  return e;
};
const fmt = (n) => Number(n).toLocaleString('en-US');
const KINDS = ['theorem', 'definition', 'abbrev', 'inductive', 'constructor', 'opaque', 'axiom', 'quotient'];
const kindColor = (k) => `var(--k-${KINDS.includes(k) ? k : 'unknown'})`;
const EXAMPLES = ['Nat.add_comm', 'Real.sqrt_nonneg', 'Commute.exp_right'];

const MAX_CHARS = 46; // a node's name, on its top edge
// A count short enough to fit in a node: 183, 1.7k, 70k.
const compact = (n) => (n < 1000 ? String(n) : n < 10000 ? (n / 1000).toFixed(1).replace(/\.0$/, '') + 'k' : Math.round(n / 1000) + 'k');
// The same count as a share of the node's width, on a log scale: the foundations of Mathlib
// have about 260,000 dependents, a typical lemma a handful.
const usageShare = (n) => Math.min(1, Math.log10(n + 1) / Math.log10(260000));
// PageRank as a multiple of the average score (1 / number of declarations): "0.2×", "620×".
const AVERAGE_RANK = 1 / 308129;
const timesAverage = (pr) => {
  const x = Number(pr) / AVERAGE_RANK;
  return (x >= 100 ? compact(Math.round(x)) : x >= 10 ? x.toFixed(0) : x >= 1 ? x.toFixed(1) : x.toFixed(2)) + '×';
};
// What a node's number and bar can measure. `share` is the bar length, 0 to 1, on a log scale.
const METRICS = {
  reach: {
    legend: 'used by how many declarations, directly or indirectly',
    of: (n) => ({ label: compact(usedBy(n)), share: usageShare(usedBy(n)), zero: !usedBy(n) }),
  },
  direct: {
    legend: 'used directly by how many declarations',
    of: (n) => ({ label: compact(n.in_degree), share: Math.min(1, Math.log10(n.in_degree + 1) / Math.log10(90000)), zero: !n.in_degree }),
  },
  pagerank: {
    legend: 'PageRank, as a multiple of the average declaration',
    // The scale runs from a tenth of the average to about 5,000 times it, the highest in Mathlib.
    of: (n) => {
      const x = Number(n.pagerank) / AVERAGE_RANK;
      return { label: timesAverage(n.pagerank), share: Math.max(0, Math.min(1, (Math.log10(x) + 1) / (Math.log10(5000) + 1))), zero: false };
    },
  },
};
// Which measure the nodes show; a reader's preference, kept in this browser.
let chosenMetric = null; // set when picked on this page, so the choice holds even if it cannot be saved
function metric() {
  if (chosenMetric) return chosenMetric;
  try { const m = localStorage.getItem('metric'); return Object.hasOwn(METRICS, m) ? m : 'reach'; } catch { return 'reach'; }
}

// How many declarations rest on this one, directly or through others. Databases built before
// that count existed only have the direct one.
const usedBy = (n) => n.reach ?? n.in_degree;
const usedByText = (n) => n.reach === null || n.reach === undefined
  ? `used by ${fmt(n.in_degree)} declaration${n.in_degree === 1 ? '' : 's'}`
  : n.reach === 0 ? 'nothing in Mathlib uses it'
  : `used by ${n.reach > 128 ? 'about ' : ''}${fmt(n.reach)} declaration${n.reach === 1 ? '' : 's'} in all, ${fmt(n.in_degree)} directly`;
const shorten = (s) => (s.length <= MAX_CHARS ? s : s.slice(0, 14) + '…' + s.slice(-(MAX_CHARS - 15)));

// ---------- state lives in the URL hash ----------
function readState() {
  const p = new URLSearchParams(location.hash.slice(1));
  const d = Number(p.get('d')), l = Number(p.get('l'));
  return {
    n: p.get('n') || '',
    d: [1, 2, 3].includes(d) ? d : 1,
    e: p.get('e') !== '0',
    l: [10, 25, 50, 100].includes(l) ? l : 10,
    p: p.get('p') === '1', // show Lean core plumbing; hidden unless asked for
    t: p.get('t') === '1', // theorems only
  };
}
function go(patch) {
  const s = { ...readState(), ...patch };
  const p = new URLSearchParams({ n: s.n, d: s.d, e: s.e ? 1 : 0, l: s.l, ...(s.p ? { p: 1 } : {}), ...(s.t ? { t: 1 } : {}) });
  const next = '#' + p.toString();
  if (next === location.hash) return load();
  if ('n' in patch) location.hash = next; // a new focus is a history entry
  else { history.replaceState(null, '', next); load(); } // depth, filter and cap are not
}

// ---------- pan / zoom ----------
// The graph is two layers under one camera: an SVG for the edges and column headings, and
// HTML boxes for the nodes (formulas are typeset as HTML, which SVG cannot hold reliably).
const svg = $('svg'), view = $('view'), stage = $('stage'), boxes = $('boxes');
const cam = { x: 0, y: 0, k: 1 };
let bbox = null;

const GAP_X = 110, GAP_Y = 24, EMPTY_W = 250;
let lastDrawn = null; // what the graph shows, to redraw it when only how nodes look changes
function draw(data, state) {

  const { height: H } = svg.getBoundingClientRect();
  const edgesOf = new Map(); // node element -> edge elements

  const addNode = (n, isFocus) => {
    const body = nodeBody(n);
    const box = h('div', { className: 'node' + (isFocus ? ' focus' : '') + (n.kind ? '' : ' stub') + (body ? '' : ' compact') });
    box.title = n.name + (n.kind ? ` — ${n.kind}` : '') +
      (n.in_degree === null ? '' : ` — ${usedByText(n)} — PageRank ${Number(n.pagerank).toExponential(2)}, ${timesAverage(n.pagerank)} the average`);
    const dot = h('span', { className: 'dot' });
    dot.style.background = kindColor(n.kind);
    const title = h('div', { className: 'ntitle' }, dot, h('span', { className: 'nname', textContent: shorten(n.name) }));
    box.append(title);
    if (body) box.append(body);
    if (n.in_degree !== null) {
      // How much of Mathlib rests on this declaration, by the chosen measure: a number, and a bar along the bottom.
      const shown = METRICS[metric()].of(n);
      title.append(h('span', { className: 'count' + (shown.zero ? ' zero' : ''), textContent: shown.label }));
      if (shown.share > 0) {
        const bar = h('div', { className: 'usage' });

        box.append(bar);

      box.addEventListener('keydown', (e) => { if (e.key === 'Enter') go({ n: n.name }); });
    }

      stage.classList.toggle('hovering', flag);
      box.classList.toggle('hl', flag);
      for (const p of edgesOf.get(box)) { p.classList.toggle('hl', flag); p.ends.forEach((o) => o !== box && o.classList.toggle('hl', flag)); }

    box.addEventListener('pointerleave', on(false));

    box.addEventListener('blur', on(false));

    boxes.append(box);
    return box;

  const focusEl = (focusNode = addNode(data.focus, true));
  const cols = [];

    for (let d = 1; d <= state.d; d++) {
      const nodes = data[side].nodes.filter((n) => n.dist === d);

  // each box flush against the side that faces the focus.

  // the best-ranked nodes are on screen.

// The panel below the graph: the proof (or a definition's body) of the focused declaration.
function showProof(p) {

    $('proof-title').textContent = p.title;
    $('proof-name').textContent = p.name;

// The graph keeps only the top-ranked dependencies, which are the generic ones. Once the
// source is known, make sure every dependency it names is drawn as well.
async function pinNamed(f, seq) {
  const named = [...new Set([...document.querySelectorAll('#panel a.dep, #proof a.dep')].map((a) => a.title))];
  if (seq !== loadSeq || !named.some((n) => !nodeByName.has(n))) return;
  const state = readState();
  try {
    const res = await fetch('/api/node', {
      method: 'POST',
      body: JSON.stringify({ name: f.name, depth: state.d, explicit: state.e, limit: state.l, pin: named, plumbing: state.p, theorems: state.t }),
    });
    if (!res.ok) return;
    const data = await res.json();
    if (seq === loadSeq) draw(data, state);
  } catch { /* the graph without the extra nodes is still correct */ }
}

// The statement typeset as mathematics, as [text block, copy button], or null when it cannot be (a structure, a statement
// the converter does not understand, KaTeX not loaded, or LaTeX that KaTeX rejects).
function renderMath(statement, name, context) {
  const tex = window.LeanLatex && window.katex ? LeanLatex.toLatex(statement, name, context, { notation: notation() }) : null;
  if (!tex) return null;
  const box = h('div', { className: 'tex' }, h('span', { className: 'kind', textContent: tex.kind + '. ' }));
  try {
    for (const part of tex.parts) {
      if ('text' in part) { box.append(part.text); continue; }
      const span = h('span', part.display ? { className: 'display' } : {});
      katex.render(part.math, span, { displayMode: !!part.display, throwOnError: true, strict: false });
      box.append(span);
    }
  } catch { return null; }
  const copy = h('button', { type: 'button', textContent: 'Copy LaTeX' });
  copy.onclick = async () => {
    try { await navigator.clipboard.writeText(tex.source); copy.textContent = 'Copied'; }
    catch { copy.textContent = 'Copy failed'; }
    setTimeout(() => (copy.textContent = 'Copy LaTeX'), 1200);
  };
  return [box, copy];
}

// A docstring with its `code` and **bold** marks shown as such; everything else is plain text.
function docText(doc) {
  const frag = document.createDocumentFragment();
  for (const piece of doc.split(/(\*\*[^*\n]+\*\*|`[^`\n]+`)/)) {
    if (/^\*\*.+\*\*$/.test(piece)) frag.append(h('strong', { textContent: piece.slice(2, -2) }));
    else if (/^`.+`$/.test(piece)) frag.append(h('code', { textContent: piece.slice(1, -1) }));
    else frag.append(piece);
  }
  return frag;
}

// Which notation conventions to typeset with; a reader's preference, kept in this browser.
function notation() {
  try { return localStorage.getItem('notation') === 'fr' ? 'fr' : 'intl'; } catch { return 'intl'; }
}
$('notation').value = notation();
$('notation').onchange = (e) => {
  try { localStorage.setItem('notation', e.target.value); } catch { /* private mode: applies to this page only */ }
  drawBand();
  if (lastDrawn) draw(lastDrawn.data, lastDrawn.state); // the formulas in the nodes follow the notation too
};

// Above the graph: what the source says about the declaration, then its statement typeset.
let band = null; // { r: the source lookup, f: the focused node } for the declaration on show
function drawBand() {
  if (!band) return showTheorem(null);
  const { r, f } = band;
  const math = renderMath(r.statement, f.name, r.context);
  const doc = r.doc ? h('p', { className: 'doc' }, docText(r.doc)) : null;
  showTheorem(doc || math ? [h('div', { className: 'main' }, ...[doc, math && math[0]].filter(Boolean)), ...(math ? [math[1]] : [])] : null);
}

// The band above the graph: the docstring and the focused declaration's statement, typeset.
function showTheorem(nodes) {
  const band = $('theorem'), wasHidden = band.hidden;
  band.replaceChildren(...(nodes || []));
  band.hidden = !nodes;
  band.scrollTop = 0;

// Fills `box` with the declaration's Lean statement, read from its source file on GitHub;
// the proof goes to the panel below the graph.
const WHY_NOT = {
  not_in_file: 'Not written out in the source file. Lean probably generated this declaration (from a structure, an attribute such as @[simps] or @[to_additive], or an unnamed instance).',
  file_missing: 'The source file is no longer at this path on Mathlib’s master branch.',
  fetch_failed: 'Couldn’t download the source file from GitHub.',

async function loadStatement(f, box, srcLink) {
  if (!sourceUrl(f.file_module)) { band = null; showTheorem(null); return showProof(null); } // Lean core: the dataset has no source file
  const seq = loadSeq;
  const note = (text) => h('p', { className: 'note', textContent: text });
  box.replaceChildren(h('h3', { textContent: 'Statement' }), note('Loading from GitHub…'));
  let r;
  try {
    const res = await fetch('/api/source?name=' + encodeURIComponent(f.name));
    if (!res.ok) throw new Error();
    r = await res.json();
  } catch { r = { found: false, reason: 'fetch_failed' }; }
  if (seq !== loadSeq) return;
  const kids = [h('h3', { textContent: 'Statement' })];
  if (r.found) {
    kids.push(h('pre', {}, h('code', {}, renderLean(r.statement, r.deps, f.name))));
    kids.push(note(`Line ${fmt(r.line)} on today’s master branch, which may differ from the February 2026 snapshot behind the graph.`));
    if (srcLink) srcLink.href = r.url;

  const done = () => pinNamed(f, seq);
  setTimeout(done, 0);
  showProof(r.found && r.body ? { title: f.kind === 'theorem' ? 'Proof' : 'Definition', name: f.name, body: r.body, deps: r.deps } : null);
}
function drawPanel(data) {
  const f = data.focus;
  const copy = h('button', { type: 'button', textContent: 'Copy name' });
  copy.onclick = async () => {
    try { await navigator.clipboard.writeText(f.name); copy.textContent = 'Copied'; }
    catch { copy.textContent = 'Copy failed'; }
    setTimeout(() => (copy.textContent = 'Copy name'), 1200);
  };
  const dot = h('span', { className: 'dot' });
  dot.style.background = kindColor(f.kind);
  const dl = h('dl');
  row(dl, 'Namespace', f.module, true);
  const src = sourceUrl(f.file_module);
  const srcLink = src && h('a', { href: src, target: '_blank', rel: 'noopener', textContent: f.file_module });
  row(dl, 'Source file', srcLink || f.file_module, true);
  const statement = h('div');
  loadStatement(f, statement, srcLink);
  if (f.out_degree !== null) row(dl, 'Depends on', `${fmt(f.out_degree)} declarations`);
  if (f.in_degree !== null) row(dl, 'Used directly by', `${fmt(f.in_degree)} declarations`);
  if (f.reach !== null && f.reach !== undefined) row(dl, 'Used in all by', `${f.reach > 128 ? 'about ' : ''}${fmt(f.reach)} declarations`);
  if (f.kind) row(dl, 'PageRank', Number(f.pagerank).toExponential(2));
  if (f.dag_layer !== null) row(dl, 'DAG layer', f.dag_layer === -1 ? 'in a cycle' : String(f.dag_layer));
  if (f.is_tactic_proof) row(dl, 'Proof', `tactic proof, ${fmt(f.tactic_count ?? 0)} tactic${f.tactic_count === 1 ? '' : 's'}` + (f.top_tactic ? `, mostly ${f.top_tactic}` : ''));
  if (f.is_instance) row(dl, 'Instance of', f.instance_class || 'a typeclass', true);
  if (f.to_additive_pair && f.pair_exists) {
    const b = h('button', { type: 'button', className: 'linklike', textContent: f.to_additive_pair });
    b.onclick = () => go({ n: f.to_additive_pair });
    row(dl, 'Additive pair', b);
  } else row(dl, 'Additive pair', f.to_additive_pair, true); // most pairs are not nodes in this dataset
  const docs = h('a', {
    href: 'https://leanprover-community.github.io/mathlib4_docs/find/?pattern=' + encodeURIComponent(f.name) + '#doc',
    target: '_blank', rel: 'noopener', textContent: 'Mathlib docs ↗',
  });
  $('panel').replaceChildren(
    h('h2', { textContent: f.name }),
    h('div', { className: 'kind' }, dot, f.kind || 'no metadata in dataset'),
    h('div', { className: 'actions' }, copy, docs),
    statement,
    dl,
    h('p', { className: 'note', textContent:
      'Counts above are for the whole graph, including dependencies Lean filled in by itself. ' +
      'Arrows point from a declaration to what it depends on. Click a node to focus on it; ' +
      'drag or scroll to move, pinch or ⌘/Ctrl-scroll to zoom.' })
  );
}

// ---------- loading ----------
let loadSeq = 0;
async function load() {
  const state = readState();
  $('explicit').checked = state.e;
  $('plumbing').checked = !state.p;
  $('theorems').checked = state.t;
  $('limit').value = String(state.l);
  for (const b of $('depth').children) b.setAttribute('aria-pressed', String(Number(b.dataset.v) === state.d));
  const seq = ++loadSeq;
  if (!state.n) {
    clearGraph();
    showProof(null);
    band = null;
    showTheorem(null);
    $('panel').replaceChildren(h('p', { className: 'note', textContent: 'Details of the focused declaration appear here.' }));
    document.title = 'Mathlib graph navigator';
    showMessage(h('h2', { textContent: 'Pick a declaration to explore' }),
      h('p', { textContent: 'Search above, or start from one of these:' }), h('p', {}, ...exampleLinks()));
    return;
  }
  let res, data;
  try {
    res = await fetch(`/api/node?name=${encodeURIComponent(state.n)}&depth=${state.d}&explicit=${state.e ? 1 : 0}&limit=${state.l}&plumbing=${state.p ? 1 : 0}&theorems=${state.t ? 1 : 0}`);
    data = await res.json();
  } catch {
    if (seq !== loadSeq) return;
    clearGraph();
    $('panel').replaceChildren();
    return showMessage(h('h2', { textContent: 'Can’t reach the server' }), h('p', { textContent: 'Check that “node server.js” is still running, then reload.' }));
  }
  if (seq !== loadSeq) return;
  if (!res.ok) {
    clearGraph();
    $('panel').replaceChildren();
    showProof(null);
    band = null;
    showTheorem(null);
    document.title = 'Mathlib graph navigator';
    return showMessage(
      h('h2', { textContent: res.status === 404 ? 'No declaration with that name' : 'Something went wrong' }),
      h('p', {}, h('code', { textContent: state.n }), res.status === 404 ? ' is not in this Mathlib snapshot. Names are case-sensitive; try the search.' : ` (server answered ${res.status}).`));
  }
  showMessage();
  document.title = `${data.focus.name} — Mathlib graph navigator`;
  draw(data, state);
  drawPanel(data);
}
window.addEventListener('hashchange', load);
window.addEventListener('resize', relayout);

// ---------- controls ----------
$('explicit').onchange = (e) => go({ e: e.target.checked });
$('plumbing').onchange = (e) => go({ p: !e.target.checked });
$('theorems').onchange = (e) => go({ t: e.target.checked });
$('nodestyle').value = nodeStyle();
$('nodestyle').onchange = (e) => {
  chosenStyle = e.target.value === 'names' ? 'names' : 'formulas';
  try { localStorage.setItem('nodeStyle', chosenStyle); } catch { /* private mode: applies to this page only */ }
  if (lastDrawn) draw(lastDrawn.data, lastDrawn.state);
};
$('metric').value = metric();
$('metric').onchange = (e) => {
  chosenMetric = Object.hasOwn(METRICS, e.target.value) ? e.target.value : 'reach';
  try { localStorage.setItem('metric', e.target.value); } catch { /* private mode: applies to this page only */ }
  $('legend-metric').textContent = METRICS[metric()].legend;
  if (lastDrawn) draw(lastDrawn.data, lastDrawn.state);
};
$('limit').onchange = (e) => go({ l: Number(e.target.value) });
$('depth').onclick = (e) => { if (e.target.dataset.v) go({ d: Number(e.target.dataset.v) }); };
$('legend').append(...KINDS.map((k) => {
  const d = h('span', { className: 'dot' });
  d.style.background = kindColor(k);
  return h('span', {}, d, k);
}), h('span', { title: 'The number at the right of each node, and the bar under its name (log scale)' },
  h('span', { className: 'bar' }), h('span', { id: 'legend-metric', textContent: METRICS[metric()].legend })));

// ---------- search ----------
const q = $('q'), results = $('results');
let items = [], itemsFor = null, active = -1, searchSeq = 0, timer = 0, pickFirst = false;
const closeResults = () => { results.hidden = true; active = -1; };
function renderResults(note) {
  results.replaceChildren(...(items.length ? items.map((n, i) => {
    const d = h('span', { className: 'dot' });
    d.style.background = kindColor(n.kind);
    const li = h('li', { role: 'option', className: i === active ? 'active' : '' }, d,
      h('span', { className: 'nm', textContent: n.name }), h('span', { className: 'meta', textContent: n.kind || '' }));
    li.setAttribute('aria-selected', String(i === active));
    li.addEventListener('pointerdown', (e) => { e.preventDefault(); choose(n.name); });
    return li;
  }) : [h('li', { className: 'none', textContent: note || 'No matches' })]));
  results.hidden = false;
  results.querySelector('.active')?.scrollIntoView({ block: 'nearest' });
}
function choose(name) {
  clearTimeout(timer); searchSeq++; pickFirst = false; // drop any search still on its way
  q.value = ''; itemsFor = null; closeResults(); q.blur(); go({ n: name });
}
async function runSearch() {
  const term = q.value.trim(), seq = ++searchSeq;
  if (!term) return closeResults();
  try {
    const res = await fetch('/api/search?limit=15&q=' + encodeURIComponent(term));
    if (!res.ok) throw new Error();
    const found = await res.json();
    if (seq !== searchSeq) return;
    items = found; itemsFor = term; active = found.length ? 0 : -1;
    if (pickFirst && found.length) return choose(found[0].name);
    pickFirst = false;
    renderResults();
  } catch {
    if (seq !== searchSeq) return;
    items = []; itemsFor = null; active = -1; pickFirst = false;
    renderResults('Search failed — is the server running?');
  }
}
q.addEventListener('input', () => { pickFirst = false; clearTimeout(timer); timer = setTimeout(runSearch, 150); });
q.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { closeResults(); q.blur(); }
  else if (e.key === 'Enter') {
    const term = q.value.trim();
    if (!term) return;
    // Only trust the list if it was fetched for exactly what is typed; otherwise search now and take the best match.
    if (itemsFor === term && !results.hidden && items[active]) choose(items[active].name);
    else if (itemsFor !== term) { pickFirst = true; clearTimeout(timer); runSearch(); }
  } else if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && items.length && !results.hidden && itemsFor === q.value.trim()) {
    e.preventDefault();
    active = (active + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
    renderResults();
  }
});
q.addEventListener('blur', closeResults);
q.addEventListener('focus', () => { if (q.value.trim()) runSearch(); });
window.addEventListener('keydown', (e) => {
  if (e.key === '/' && document.activeElement !== q && !e.metaKey && !e.ctrlKey) { e.preventDefault(); q.focus(); }
});

// Open on a default declaration when the address names none.
const DEFAULT_FOCUS = 'EuclideanGeometry.dist_sq_eq_dist_sq_add_dist_sq_iff_angle_eq_pi_div_two'; // the Pythagorean theorem
if (!readState().n) history.replaceState(null, '', '#n=' + encodeURIComponent(DEFAULT_FOCUS));
// The title is the way home: the default declaration with the default view settings.
$('home').addEventListener('click', (e) => {
  if (e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0) return; // let "open in new tab" work
  e.preventDefault();
  go({ n: DEFAULT_FOCUS, d: 1, e: true, l: 10, p: false, t: false });
});
load();
</script>
</body>
</html>
